<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Agent — Conversational Prototype</title>
<style>
  :root{
    --bg:#faf7f2; --panel:#ffffff; --panel2:#f6f1e9; --line:#e3d9cb;
    --text:#3d3226; --muted:#6b5d4f; --accent:#b4540f; --accent2:#c97b2d;
    --green:#2f7d4f; --amber:#a8641a; --red:#b02a2a; --cyan:#2b6a7a;
    --accent-bg:#fbeadd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:14px}
  .app{display:flex;min-height:100vh}
  .side{width:230px;background:#f3ece1;border-right:1px solid var(--line);padding:18px 14px;flex-shrink:0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 6px}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:500;font-size:14px}
  .nav .item:hover{background:#fff;color:var(--text)}
  .nav .item.active{background:var(--accent-bg);color:var(--accent)}
  .nav .item .i{width:18px;text-align:center}
  .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
  .badge.amber{background:var(--amber)}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-left:6px}
  .side-foot .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
  .side-foot .nm{font-size:13px}.side-foot .rl{font-size:11px;color:var(--muted)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
  .topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;flex-shrink:0}
  .topbar .crumb{color:var(--muted);font-size:14px}.topbar .crumb b{color:var(--text)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .pill{background:var(--panel2);border:1px solid var(--line);padding:5px 12px;border-radius:16px;font-size:12px}
  .switch{margin-left:auto;display:flex;gap:6px}
  .switch button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer}
  .switch button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .chatwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .chatscroll{flex:1;overflow-y:auto;padding:24px 0}
  .chatinner{max-width:820px;margin:0 auto;padding:0 22px;display:flex;flex-direction:column;gap:14px}

  .msg{display:flex;gap:12px;max-width:100%}
  .msg .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .msg.agent .av{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}
  .msg.user{flex-direction:row-reverse}
  .msg.user .av{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .msg .body{max-width:640px}
  .msg .who{font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .msg .bubble{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;font-size:14px;line-height:1.55}
  .msg.user .bubble{background:var(--accent-bg);border-color:#f0c9a8}

  .uicard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}
  .uicard .tt{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:none}
  .row .lab{color:var(--muted)}.row .val{font-weight:600}
  .row .val.green{color:var(--green)}.row .val.amber{color:var(--amber)}.row .val.red{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:16px;font-size:13px;cursor:pointer;font-weight:600}
  .chip:hover{border-color:var(--accent)}
  .chip.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.green{background:var(--green);color:#fff;border-color:var(--green)}
  .chip.small{padding:5px 10px;font-size:12px}

  .typing{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;padding:4px 0}
  .typing .dots{display:flex;gap:4px}
  .typing .dots span{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:bounce 1s infinite}
  .typing .dots span:nth-child(2){animation-delay:.15s}.typing .dots span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

  .composer{background:#fff;border-top:1px solid var(--line);padding:16px 22px;flex-shrink:0}
  .composer .inner{max-width:820px;margin:0 auto}
  .composer .suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .composer .suggest button{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer}
  .composer .suggest button:hover{border-color:var(--accent);color:var(--text)}
  .chatinput{display:flex;gap:10px;align-items:center}
  .chatinput input{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;outline:none}
  .chatinput input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)22}
  .chatinput .send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700;font-size:14px}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:14px 20px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(120px);opacity:0;transition:.3s;z-index:90}
  .toast.show{transform:none;opacity:1}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  .kpi .n{font-size:19px;font-weight:700}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

  @media(max-width:800px){.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">🪙</div> Tax Agent</div>
    <div class="nav">
      <div class="item active"><span class="i">🔍</span> Discrepancies <span class="badge">3</span></div>
      <div class="item" onclick="goPanel('rule')"><span class="i">📜</span> Rule Updates <span class="badge amber">1</span></div>
      <div class="item"><span class="i">🧩</span> Tax Audit</div>
      <div class="item"><span class="i">📋</span> SKU Taxonomy</div>
      <div class="item"><span class="i">🧾</span> Reports</div>
      <div class="item"><span class="i">⚙️</span> Settings</div>
    </div>
    <div class="side-foot"><div class="av">YS</div><div><div class="nm">Yu-Ting Sun</div><div class="rl">Finance Analyst</div></div></div>
  </aside>

  <div class="main" id="mainPanel">
    <div class="topbar">
      <div class="crumb" id="crumb">Discrepancies <b>/ Case DC-1042</b></div>
      <div class="right"><span class="pill">🟢 Connected</span><span class="pill">Q3 2026 · WA</span></div>
      <div class="switch">
        <button id="btnDisc" class="active" onclick="goPanel('disc')">Debug</button>
        <button id="btnRule" onclick="goPanel('rule')">Rule alert</button>
      </div>
    </div>
    <div class="chatwrap">
      <div class="chatscroll" id="scroll"><div class="chatinner" id="chat"></div></div>
      <div class="composer">
        <div class="inner">
          <div class="suggest" id="suggest"></div>
          <div class="chatinput">
            <input id="input" placeholder="Ask Agent 3…" onkeydown="if(event.key==='Enter')send()">
            <button class="send" onclick="send()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast">✅ Applied — liability updated +$29,860</div>

<script>
var chat=document.getElementById('chat');
var model='disc';
var busy=false;

function addMsg(role,who,text,asHtml){
  var m=document.createElement('div');m.className='msg '+role;
  var av=role==='agent'?'🤖':(model==='rule'?'YS':'YS');
  m.innerHTML='<div class="av">'+(role==='agent'?'🤖':'YS')+'</div><div class="body"><div class="who">'+(role==='agent'?'Agent 3 · Tax Ops PM':'You')+'</div><div class="bubble">'+(asHtml?text:text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))+'</div></div>';
  chat.appendChild(m);scrollBottom();
}
function addCard(html){
  var d=document.createElement('div');d.className='msg agent';
  d.innerHTML='<div class="av">🤖</div><div class="body"><div class="who">Agent 3 · Tax Ops PM</div><div class="uicard">'+html+'</div></div>';
  chat.appendChild(d);scrollBottom();
}
function showTyping(){
  var t=document.createElement('div');t.className='typing';t.id='typing';
  t.innerHTML='<div class="dots"><span></span><span></span><span></span></div> Agent 3 is thinking…';
  chat.appendChild(t);scrollBottom();
}
function hideTyping(){var t=document.getElementById('typing');if(t)t.remove();}
function scrollBottom(){var s=document.getElementById('scroll');s.scrollTop=s.scrollHeight;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}

function suggest(arr){document.getElementById('suggest').innerHTML=arr.map(function(x){return '<button onclick="ask(\''+x+'\')">'+x+'</button>';}).join('');}

// Persistent quick-access buttons (always visible above the composer)
var quickBtns={
  disc:['Why did this change?','Show source txns','View rule detail','✅ Approve reclass','Open in tax platform'],
  rule:['Why did the rate change?','Show old vs new tax','View rule detail','✅ Apply new rate','Open in tax platform']
};
function persistentSuggest(){
  var arr=quickBtns[model]||[];
  document.getElementById('suggest').innerHTML=arr.map(function(x){return '<button onclick="ask(\''+x+'\')">'+x+'</button>';}).join('');
}
function removeQuick(label){
  quickBtns[model]=quickBtns[model].filter(function(x){return x!==label;});
  persistentSuggest();
}

function ask(q){document.getElementById('input').value=q;send();}

function send(){
  var inp=document.getElementById('input');var v=inp.value.trim();if(!v||busy)return;
  inp.value='';addMsg('user','You',v);busy=true;showTyping();
  setTimeout(function(){
    hideTyping();
    var r=respond(v); 
    if(r.card){addMsg('agent','Agent 3',r.text,true);addCard(r.card);}else addMsg('agent','Agent 3',r.text,true);
    busy=false;scrollBottom();
  },900);
}

function respond(q){
  q=q.toLowerCase();
  if(q.indexOf('approve')>=0||q.indexOf('apply')>=0||q.indexOf('yes')>=0||q.indexOf('confirm')>=0){
    if(model==='rule'){
      removeQuick('✅ Apply new rate');
      setTimeout(function(){toast('✅ Applied — rate updated, liability +$29,860');},600);
      return {text:'✅ Done — the new <b>9.6%</b> rate is applied. The tax platform now charges the updated rate on these SKUs, and the under-collected <b>+$29,860</b> is booked for Q3. <span style="color:var(--green)">The alert is resolved.</span><br><br>Want me to rerun the Q3 tax computation to confirm the new liability?',card:''};
    }
    removeQuick('✅ Approve reclass');
    setTimeout(function(){toast('✅ Applied — liability updated +$29,860');},600);
    return {text:'✅ Done — reclassification applied. The internal system now shows <b>taxable</b>, the liability is adjusted by <b>+$29,860</b>, and Agent 1 has updated the taxonomy so future WA digital SKUs won’t drift. <span style="color:var(--green)">Case DC-1042 is resolved.</span> <br><br>Want me to run an annual reconciliation to catch any other mismatches?',card:''};
  }
  if(q.indexOf('why')>=0||q.indexOf('changed')>=0||q.indexOf('change')>=0||q.indexOf('rate')>=0){
    if(model==='rule'){
      return {text:'Washington raised the <b>combined sales tax rate</b> from <b>8.9% to 9.6%</b>, effective <b>April 2026</b>. Our billing system was still charging the old 8.9% rate, so the tax collected on these SKUs is understated versus the new rate — that’s the gap.',card:''};
    }
    return {text:'Washington updated the <b>digital-services taxability rule</b>, effective <b>April 2026</b>. Our internal billing system was still classifying SKU <b>SUB-WA-DIG</b> as <i>exempt</i>, but the tax platform picked up the new rule and treats it as <i>taxable</i>. That’s the classification mismatch driving the gap.',card:''};
  }
  if(q.indexOf('skus')>=0||q.indexOf('affected')>=0||q.indexOf('old vs new')>=0||q.indexOf('source')>=0||q.indexOf('transaction')>=0||q.indexOf('txn')>=0){
    if(model==='rule'){
      return {text:'Here’s where the old and new tax stack up per SKU.<br><table><tr><th>SKU</th><th>Old tax (8.9%)</th><th>New tax (9.6%)</th><th>Δ</th></tr><tr><td>SUB-WA-DIG</td><td>$268,780</td><td>$289,920</td><td style="color:var(--green)">+$21,140</td></tr><tr><td>SUB-WA-STD</td><td>$75,396</td><td>$81,326</td><td style="color:var(--green)">+$5,930</td></tr><tr><td>ADD-WA-API</td><td>$39,857</td><td>$42,647</td><td style="color:var(--green)">+$2,790</td></tr></table>',card:''};
    }
    return {text:'Here are the source transactions behind the gap.<br><table><tr><th>Date</th><th>SKU</th><th>Amount</th><th>Tax</th></tr><tr><td>Apr 18</td><td>SUB-WA-DIG</td><td>$8,420</td><td>$672</td></tr><tr><td>May 02</td><td>SUB-WA-DIG</td><td>$9,180</td><td>$734</td></tr><tr><td>Jun 21</td><td>SUB-WA-DIG</td><td>$12,260</td><td>$981</td></tr></table>',card:''};
  }
  if(q.indexOf('rule')>=0||q.indexOf('detail')>=0||q.indexOf('regulation')>=0){
    if(model==='rule'){
      return {text:'The rate change comes from <b>WA Dept. of Revenue</b> — the combined sales tax rate increased for the jurisdiction.',card:'<div class="tt">📄 Rule detail</div><div class="row"><span class="lab">Jurisdiction</span><span class="val">Washington (WA)</span></div><div class="row"><span class="lab">Old rate</span><span class="val">8.9%</span></div><div class="row"><span class="lab">New rate</span><span class="val">9.6%</span></div><div class="row"><span class="lab">Effective</span><span class="val">Apr 2026</span></div><div class="row"><span class="lab">Scope</span><span class="val">All taxable sales</span></div>'};
    }
    return {text:'The rule change is <b>WA SB 6204</b> — digital services are now taxable in Washington, effective April 2026. This applies to SaaS/streaming/API subscriptions regardless of delivery method.',card:'<div class="tt">📄 Rule detail</div><div class="row"><span class="lab">Jurisdiction</span><span class="val">Washington (WA)</span></div><div class="row"><span class="lab">Rule</span><span class="val">SB 6204</span></div><div class="row"><span class="lab">Effective</span><span class="val">Apr 2026</span></div><div class="row"><span class="lab">Scope</span><span class="val">Digital services now taxable</span></div>'};
  }
  // default
  if(model==='rule'){
    return {text:'Washington raised the sales tax rate to <b>9.6%</b> in April. Our billing was still using <b>8.9%</b>, so the tax on these SKUs is understated. The difference is <b>+$29,860</b> for Q3. Would you like me to apply the new rate and book the under-collected amount?',card:''};
  }
  return {text:'The tax platform is the authoritative source for rules. Since WA changed the digital-services rule in April, <b>taxable</b> is the correct classification for <b>SUB-WA-DIG</b>. The internal system was just stale. Would you like me to approve the reclassification?',card:''};
}

function renderDiscStart(){
  chat.innerHTML='';
  // Finance analyst initiates — asks WHY there's a discrepancy
  addMsg('user','You','Why is there a <b>$29,860 discrepancy</b> between our billing and the tax platform for Q3?',true);
  showTyping();scrollBottom();
  setTimeout(function(){hideTyping();
    addMsg('agent','Agent 3','Good question. Let me walk you through it. Internal billing says <b>$4.82M</b>, the tax platform says <b>$4.79M</b> for Q3 — a $29,860 gap.',true);
    scrollBottom();
  },1000);
  setTimeout(function(){showTyping();scrollBottom();},1600);
  setTimeout(function(){hideTyping();
    addMsg('agent','Agent 3','First, I ruled out the plumbing — same entity, same currency, same period, all channels consolidated. ✅ No config issue. The gap is <i>content</i>, not setup.',true);
    addCard('<div class="tt">⚙️ Self-check passed</div><div class="row"><span class="lab">Same entity</span><span class="val green">✅</span></div><div class="row"><span class="lab">Same period</span><span class="val green">✅</span></div><div class="row"><span class="lab">All channels</span><span class="val green">✅</span></div><div class="row"><span class="lab">Taxability</span><span class="val amber">⚠️ mismatch</span></div>');
    scrollBottom();
  },3000);
  setTimeout(function(){hideTyping();
    addMsg('agent','Agent 3','I traced it to a <b>taxability classification</b> mismatch on SKU <b>SUB-WA-DIG</b>. Here’s the breakdown 👇',true);
    addCard('<div class="tt">🕵️ Root cause · Taxability classification</div><div class="row"><span class="lab">Affected SKU</span><span class="val">SUB-WA-DIG (annual)</span></div><div class="row"><span class="lab">Internal billing says</span><span class="val amber">Exempt (stale)</span></div><div class="row"><span class="lab">Tax platform says</span><span class="val green">Taxable</span></div><div class="row"><span class="lab">Rule changed</span><span class="val">WA digital-services · Apr 2026</span></div><div class="row"><span class="lab">Correct liability</span><span class="val">+$29,860</span></div><table><tr><th></th><th>Exempt</th><th>Taxable</th></tr><tr><td>Internal (stale)</td><td><span class="dot" style="background:var(--amber)"></span>Yes</td><td>—</td></tr><tr><td>Tax platform</td><td>—</td><td><span class="dot" style="background:var(--green)"></span>Yes</td></tr></table>');
  },4600);
}

function renderRuleStart(){
  chat.innerHTML='';
  addMsg('agent','Agent 3','Heads-up, Yu-Ting 👋 <b>Agent 2 · Regulatory Watcher</b> just flagged a rate change: <b>Washington raised the combined sales tax rate</b> from <b>8.9% to 9.6%</b>, effective <b>April 2026</b>.',true);
  setTimeout(function(){showTyping();scrollBottom();},500);
  setTimeout(function(){hideTyping();
    addMsg('agent','Agent 3','This increases the tax on <b>3 of your SKUs</b>. Our billing is still charging the old 8.9% rate, so I worked out the old vs new tax impact — want to see?',true);
    addCard('<div class="tt">📋 Old vs new tax (per SKU)</div><table><tr><th>SKU</th><th>Old (8.9%)</th><th>New (9.6%)</th><th>Δ</th></tr><tr><td>SUB-WA-DIG</td><td>$268,780</td><td>$289,920</td><td style="color:var(--green)">+$21,140</td></tr><tr><td>SUB-WA-STD</td><td>$75,396</td><td>$81,326</td><td style="color:var(--green)">+$5,930</td></tr><tr><td>ADD-WA-API</td><td>$39,857</td><td>$42,647</td><td style="color:var(--green)">+$2,790</td></tr></table><div style="margin-top:10px"><b>Under-collected for Q3:</b> <span style="color:var(--green)">+$29,860</span></div>');
  },1600);
}

function goPanel(which){
  model=which==='rule'?'rule':'disc';
  document.getElementById('btnDisc').classList.toggle('active',which!=='rule');
  document.getElementById('btnRule').classList.toggle('active',which==='rule');
  document.getElementById('crumb').innerHTML=which==='rule'?'Regulatory Watch <b>/ Rate change · WA 8.9% → 9.6%</b>':'Discrepancies <b>/ Case DC-1042</b>';
  document.querySelectorAll('.nav .item').forEach(function(n){n.classList.remove('active')});
  if(which==='rule')renderRuleStart();else renderDiscStart();
  persistentSuggest();
}
renderDiscStart();
persistentSuggest();
</script>
</body>
</html>
